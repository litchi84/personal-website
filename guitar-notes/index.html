<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>指板笔记 · 荔枝小站</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#F6F1E7;
    --surface:#EDE3CF;
    --surface-2:#E3D6BB;
    --ink:#241C14;
    --muted:#6B5D4D;
    --border:#D9CBAA;
    --accent:#97701A;      /* brass — dominant / 属 */
    --accent-ink:#FBF6EA;
    --tonic:#8C4A33;       /* 主 */
    --subdom:#3F6E66;      /* 下属 */
    --shadow: 0 1px 2px rgba(36,28,20,.06), 0 8px 24px -12px rgba(36,28,20,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1E1712;
      --surface:#271E16;
      --surface-2:#33281D;
      --ink:#F1E7D6;
      --muted:#B8A98F;
      --border:#40342A;
      --accent:#D4AF37;
      --accent-ink:#1E1712;
      --tonic:#C97456;
      --subdom:#6FA79C;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1E1712;
    --surface:#271E16;
    --surface-2:#33281D;
    --ink:#F1E7D6;
    --muted:#B8A98F;
    --border:#40342A;
    --accent:#D4AF37;
    --accent-ink:#1E1712;
    --tonic:#C97456;
    --subdom:#6FA79C;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Public Sans', -apple-system, "Microsoft YaHei", sans-serif;
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background: var(--accent); color:var(--accent-ink); }

  h1,h2,h3,h4{
    font-family:'Fraunces', Georgia, "Noto Serif SC", serif;
    font-weight:600;
    text-wrap:balance;
    margin:0;
    letter-spacing:-.01em;
  }
  .mono{ font-family:'JetBrains Mono', ui-monospace, monospace; font-variant-numeric:tabular-nums; }

  a{ color:var(--accent); }

  /* ---------- app shell ---------- */
  .app{
    display:grid;
    grid-template-columns: 248px 1fr;
    min-height:100vh;
  }
  @media (max-width: 860px){
    .app{ grid-template-columns: 1fr; }
  }

  .sidebar{
    background:var(--surface);
    border-right:1px solid var(--border);
    padding:28px 18px;
    display:flex;
    flex-direction:column;
    gap:22px;
    position:sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
  }
  @media (max-width: 860px){
    .sidebar{
      position:static;
      height:auto;
      border-right:none;
      border-bottom:1px solid var(--border);
      padding:16px 16px 6px;
    }
  }

  .brand{
    display:flex;
    flex-direction:column;
    gap:2px;
    padding:0 10px 6px;
  }
  .brand .mark{ font-size:26px; font-weight:700; letter-spacing:-.02em; }
  .brand .sub{ font-size:12.5px; color:var(--muted); letter-spacing:.02em; }

  nav.steps{
    display:flex;
    flex-direction:column;
    gap:3px;
  }
  @media (max-width: 860px){
    nav.steps{
      flex-direction:row;
      overflow-x:auto;
      gap:6px;
      padding-bottom:8px;
      -webkit-overflow-scrolling:touch;
    }
  }
  .step-btn{
    all:unset;
    cursor:pointer;
    display:flex;
    align-items:baseline;
    gap:10px;
    padding:9px 10px;
    border-radius:8px;
    font-size:14.5px;
    color:var(--muted);
    white-space:nowrap;
    transition:background .15s ease, color .15s ease;
  }
  .step-btn .n{ font-family:'JetBrains Mono',monospace; font-size:12px; opacity:.7; }
  .step-btn:hover{ background:var(--surface-2); color:var(--ink); }
  .step-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .step-btn.active{ background:var(--surface-2); color:var(--ink); font-weight:600; }
  .step-btn.active .n{ color:var(--accent); opacity:1; }

  .sidebar-foot{
    margin-top:auto;
    padding:10px 10px 0;
    font-size:12px;
    color:var(--muted);
    border-top:1px solid var(--border);
    padding-top:14px;
  }
  @media (max-width: 860px){ .sidebar-foot{ display:none; } }

  main{
    padding: 44px clamp(20px, 5vw, 64px) 90px;
    max-width: 920px;
  }
  section.panel{ display:none; }
  section.panel.active{ display:block; animation: fade .25s ease; }
  @media (prefers-reduced-motion: reduce){ section.panel.active{ animation:none; } }
  @keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:10px;
  }
  h1.title{ font-size:clamp(28px,3.4vw,38px); margin-bottom:6px; }
  .dek{ color:var(--muted); font-size:16px; max-width:60ch; margin-bottom:34px; }

  h2.sec{ font-size:21px; margin:40px 0 14px; }
  h2.sec:first-of-type{ margin-top:0; }
  h3.sub{ font-size:16.5px; margin:22px 0 10px; color:var(--ink); }
  p{ margin:0 0 14px; max-width:66ch; }
  p.tight{ margin-bottom:8px; }

  ul.list, ol.list{ margin:0 0 16px; padding-left:1.3em; max-width:64ch; }
  ul.list li, ol.list li{ margin-bottom:7px; }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:20px 22px;
    box-shadow:var(--shadow);
    margin-bottom:18px;
  }
  .card + .card{ margin-top:0; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  @media (max-width:700px){ .grid2, .grid3{ grid-template-columns:1fr; } }

  .callout{
    border-left:3px solid var(--accent);
    background:var(--surface);
    border-radius:0 10px 10px 0;
    padding:14px 18px;
    font-size:14.5px;
    color:var(--ink);
    margin:16px 0 22px;
    max-width:64ch;
  }
  .callout b{ color:var(--accent); }
  .callout.tonic{ border-color:var(--tonic); }
  .callout.tonic b{ color:var(--tonic); }

  /* ---------- pills / tags ---------- */
  .pill{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;
    padding:3px 9px;
    border-radius:999px;
    border:1px solid var(--border);
    color:var(--muted);
  }
  .pill.tonic{ color:var(--tonic); border-color:color-mix(in srgb, var(--tonic) 45%, var(--border)); }
  .pill.sub{ color:var(--subdom); border-color:color-mix(in srgb, var(--subdom) 45%, var(--border)); }
  .pill.dom{ color:var(--accent); border-color:color-mix(in srgb, var(--accent) 45%, var(--border)); }

  /* ---------- tables ---------- */
  .tbl-wrap{ overflow-x:auto; margin:0 0 20px; border:1px solid var(--border); border-radius:10px; }
  table{ border-collapse:collapse; width:100%; min-width:520px; font-size:14.5px; }
  thead th{
    text-align:left; font-family:'JetBrains Mono',monospace; font-size:11.5px;
    text-transform:uppercase; letter-spacing:.06em; color:var(--muted);
    background:var(--surface-2); padding:10px 14px; border-bottom:1px solid var(--border);
  }
  tbody td{ padding:11px 14px; border-bottom:1px solid var(--border); vertical-align:top; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:color-mix(in srgb, var(--surface-2) 55%, transparent); }

  /* ---------- chord diagrams ---------- */
  .chord-row{ display:flex; flex-wrap:wrap; gap:22px; margin:10px 0 26px; }
  .chord-card{
    display:flex; flex-direction:column; align-items:center; gap:8px;
    width:150px;
  }
  .chord-card .name{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px; }
  .chord-card .cap{ font-size:12px; color:var(--muted); text-align:center; }
  svg.diagram{ display:block; }
  .fret-label{ font-size:11px; fill:var(--muted); font-family:'JetBrains Mono',monospace; }
  .note-txt{ font-size:11px; fill:var(--accent-ink); font-family:'JetBrains Mono',monospace; font-weight:700; text-anchor:middle; dominant-baseline:central; }

  /* ---------- fretboard (pentatonic) ---------- */
  .fretboard-wrap{ overflow-x:auto; margin:14px 0 22px; }

  /* ---------- checklist ---------- */
  .check-item{
    display:flex; align-items:flex-start; gap:12px;
    padding:11px 4px; border-bottom:1px solid var(--border);
    cursor:pointer; font-size:14.5px;
  }
  .check-item:last-child{ border-bottom:none; }
  .check-item input{
    appearance:none; -webkit-appearance:none;
    width:18px; height:18px; min-width:18px; margin-top:2px;
    border:1.5px solid var(--muted); border-radius:5px;
    display:grid; place-items:center; cursor:pointer;
  }
  .check-item input:checked{ background:var(--accent); border-color:var(--accent); }
  .check-item input:checked::after{
    content:""; width:9px; height:5px; border-left:2px solid var(--accent-ink);
    border-bottom:2px solid var(--accent-ink); transform:rotate(-45deg) translate(0,-1px);
  }
  .check-item span.done{ color:var(--muted); text-decoration:line-through; }

  .progress-bar{
    height:6px; border-radius:99px; background:var(--surface-2);
    overflow:hidden; margin:6px 0 22px; max-width:64ch;
  }
  .progress-bar > i{ display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .3s ease; }

  .stepper-nav{
    display:flex; justify-content:space-between; gap:12px; margin-top:48px;
    border-top:1px solid var(--border); padding-top:22px;
  }
  .stepper-btn{
    all:unset; cursor:pointer; display:flex; flex-direction:column; gap:2px;
    padding:10px 14px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface); font-size:13.5px; color:var(--muted);
    max-width:46%;
  }
  .stepper-btn:hover{ border-color:var(--accent); color:var(--ink); }
  .stepper-btn .lbl{ font-family:'JetBrains Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; }
  .stepper-btn .ttl{ color:var(--ink); font-weight:600; font-size:14.5px; }
  .stepper-btn.next{ text-align:right; align-items:flex-end; margin-left:auto; }

  code{
    font-family:'JetBrains Mono',monospace; font-size:.92em;
    background:var(--surface-2); padding:1px 6px; border-radius:5px;
  }
</style>
</head>
<body>


<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">指板笔记</div>
      <div class="sub">乐理 · 和弦 · 即兴 — 以《朵儿》为练习场</div>
    </div>
    <nav class="steps" id="nav"></nav>
    <div class="sidebar-foot">进度会保存在这台设备的浏览器里，下次打开还在。</div>
  </aside>

  <main id="main"></main>
</div>

<script>
const CHORDS = {
  C:  { name:"C",  base:1, frets:[-1,3,2,0,1,0], fingers:[null,3,2,null,1,null] },
  G:  { name:"G",  base:1, frets:[3,2,0,0,0,3],  fingers:[3,2,null,null,null,4] },
  Am: { name:"Am", base:1, frets:[-1,0,2,2,1,0], fingers:[null,null,2,3,1,null] },
  F:  { name:"F",  base:1, frets:[1,3,3,2,1,1],  fingers:[1,3,4,2,1,1], barre:{fret:1,from:0,to:5} },
};

const NS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs){
  const el = document.createElementNS(NS, tag);
  for(const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

// standard 6-string open chord diagram, strings index 0(low E)..5(high e)
function renderChordDiagram(container, chord){
  const W = 130, H = 150;
  const left = 18, right = 112, top = 34, bottom = 130;
  const nStrings = 6, nFrets = 4;
  const stepX = (right-left)/(nStrings-1);
  const stepY = (bottom-top)/nFrets;

  const svg = svgEl("svg", { class:"diagram", viewBox:`0 0 ${W} ${H}`, width:130, height:150, role:"img",
    "aria-label": `${chord.name} 和弦指法图` });

  // nut (thicker top line) or base-fret label
  if(chord.base === 1){
    svg.appendChild(svgEl("line", { x1:left, y1:top, x2:right, y2:top, stroke:"currentColor", "stroke-width":3 }));
  } else {
    svg.appendChild(svgEl("line", { x1:left, y1:top, x2:right, y2:top, stroke:"currentColor", "stroke-width":1 }));
    const t = svgEl("text", { x:left-10, y:top+stepY*0.7, class:"fret-label", "text-anchor":"end" });
    t.textContent = chord.base + "fr";
    svg.appendChild(t);
  }
  // frets
  for(let f=1; f<=nFrets; f++){
    const y = top + f*stepY;
    svg.appendChild(svgEl("line", { x1:left, y1:y, x2:right, y2:y, stroke:"currentColor", "stroke-width":1, opacity:.45 }));
  }
  // strings
  for(let s=0; s<nStrings; s++){
    const x = left + s*stepX;
    svg.appendChild(svgEl("line", { x1:x, y1:top, x2:x, y2:bottom, stroke:"currentColor", "stroke-width":1, opacity:.6 }));
  }
  // barre
  if(chord.barre){
    const y = top + (chord.barre.fret-0.5)*stepY;
    const x1 = left + chord.barre.from*stepX, x2 = left + chord.barre.to*stepX;
    svg.appendChild(svgEl("line", { x1, y1:y, x2, y2:y, stroke:"currentColor", "stroke-width":9, "stroke-linecap":"round", opacity:.85 }));
  }
  // open/mute markers + finger dots
  chord.frets.forEach((f, s) => {
    const x = left + s*stepX;
    if(f === -1){
      const t = svgEl("text", { x, y: top-14, class:"fret-label", "text-anchor":"middle" });
      t.textContent = "×"; svg.appendChild(t);
    } else if(f === 0){
      svg.appendChild(svgEl("circle", { cx:x, cy: top-11, r:4.5, fill:"none", stroke:"currentColor", "stroke-width":1.4 }));
    } else {
      const y = top + (f-0.5)*stepY;
      svg.appendChild(svgEl("circle", { cx:x, cy:y, r:7.5, fill:"var(--accent)" }));
      if(chord.fingers && chord.fingers[s]){
        const t = svgEl("text", { x, y, class:"note-txt" });
        t.textContent = chord.fingers[s];
        svg.appendChild(t);
      }
    }
  });

  container.appendChild(svg);
}

// movable minor-pentatonic "box 1" pattern, root marked on 6th string
function renderPentatonicBox(container){
  const W = 420, H = 190;
  const left = 46, right = 400, top = 30, bottom = 160;
  const nStrings = 6, nFrets = 4;
  const stepX = (right-left)/nFrets;
  const stepY = (bottom-top)/(nStrings-1);
  const stringNames = ["E","A","D","G","B","e"];

  // offsets from root fret R, per string (low E -> high e), degrees relative to minor pentatonic
  const pattern = [
    [0,3],[0,2],[0,2],[0,2],[0,3],[0,3]
  ];

  const svg = svgEl("svg", { class:"diagram", viewBox:`0 0 ${W} ${H}`, width:"100%", height:190,
    role:"img", "aria-label":"movable 小调五声音阶 box1 指板图，横向为品，纵向为弦" });

  // strings (horizontal)
  for(let s=0; s<nStrings; s++){
    const y = top + s*stepY;
    svg.appendChild(svgEl("line", { x1:left, y1:y, x2:right, y2:y, stroke:"currentColor", "stroke-width":1, opacity:.55 }));
    const t = svgEl("text", { x:left-16, y:y, class:"fret-label", "text-anchor":"middle", "dominant-baseline":"central" });
    t.textContent = stringNames[s]; svg.appendChild(t);
  }
  // frets (vertical), R..R+4 shown as relative 0..4
  for(let f=0; f<=nFrets; f++){
    const x = left + f*stepX;
    svg.appendChild(svgEl("line", { x1:x, y1:top, x2:x, y2:bottom, stroke:"currentColor", "stroke-width": f===0?2.4:1, opacity:f===0?.9:.35 }));
    const t = svgEl("text", { x, y:bottom+18, class:"fret-label", "text-anchor":"middle" });
    t.textContent = f===0 ? "R" : "R+"+f;
    svg.appendChild(t);
  }
  // dots
  pattern.forEach((offsets, s) => {
    const y = top + s*stepY;
    offsets.forEach(o => {
      const x = left + o*stepX;
      const isRoot = (o===0);
      svg.appendChild(svgEl("circle", { cx:x, cy:y, r:9, fill: isRoot ? "var(--tonic)" : "var(--accent)", opacity: isRoot?1:.85 }));
      if(isRoot){
        const t = svgEl("text", { x, y, class:"note-txt" }); t.textContent="R"; svg.appendChild(t);
      }
    });
  });

  container.appendChild(svg);
}

/* ---------------- content data ---------------- */
const SECTIONS = [
  { id:"basics", label:"零基础乐理" },
  { id:"degrees", label:"和弦与级数" },
  { id:"shapes", label:"和弦按法图鉴" },
  { id:"impro", label:"旋律即兴" },
  { id:"arrange", label:"伴奏编配" },
  { id:"apply", label:"应用到《朵儿》" },
];

function buildNav(){
  const nav = document.getElementById("nav");
  SECTIONS.forEach((s, i) => {
    const btn = document.createElement("button");
    btn.className = "step-btn";
    btn.dataset.target = s.id;
    btn.innerHTML = `<span class="n">${String(i+1).padStart(2,"0")}</span><span>${s.label}</span>`;
    btn.addEventListener("click", () => showSection(s.id));
    nav.appendChild(btn);
  });
}

function showSection(id){
  document.querySelectorAll("section.panel").forEach(p => p.classList.toggle("active", p.id === id));
  document.querySelectorAll(".step-btn").forEach(b => b.classList.toggle("active", b.dataset.target === id));
  document.getElementById("main").scrollTo?.(0,0);
  window.scrollTo(0,0);
  try{ localStorage.setItem("gtb_last_section", id); }catch(e){}
}

function checklist(container, key, items){
  const wrap = document.createElement("div");
  wrap.className = "card";
  const bar = document.createElement("div");
  bar.className = "progress-bar";
  const fill = document.createElement("i");
  bar.appendChild(fill);
  wrap.appendChild(bar);

  let state = {};
  try{ state = JSON.parse(localStorage.getItem(key) || "{}"); }catch(e){}

  function updateBar(){
    const done = items.filter((_,i)=>state[i]).length;
    fill.style.width = (items.length ? (done/items.length*100) : 0) + "%";
  }

  items.forEach((text, i) => {
    const row = document.createElement("label");
    row.className = "check-item";
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = !!state[i];
    const span = document.createElement("span");
    span.textContent = text;
    if(cb.checked) span.classList.add("done");
    cb.addEventListener("change", () => {
      state[i] = cb.checked;
      span.classList.toggle("done", cb.checked);
      try{ localStorage.setItem(key, JSON.stringify(state)); }catch(e){}
      updateBar();
    });
    row.appendChild(cb); row.appendChild(span);
    wrap.appendChild(row);
  });
  updateBar();
  container.appendChild(wrap);
}

function stepperNav(container, id){
  const idx = SECTIONS.findIndex(s => s.id === id);
  const prev = SECTIONS[idx-1], next = SECTIONS[idx+1];
  const nav = document.createElement("div");
  nav.className = "stepper-nav";
  if(prev){
    const b = document.createElement("button");
    b.className = "stepper-btn prev";
    b.innerHTML = `<span class="lbl">← 上一节</span><span class="ttl">${prev.label}</span>`;
    b.addEventListener("click", ()=>showSection(prev.id));
    nav.appendChild(b);
  } else { nav.appendChild(document.createElement("span")); }
  if(next){
    const b = document.createElement("button");
    b.className = "stepper-btn next";
    b.innerHTML = `<span class="lbl">下一节 →</span><span class="ttl">${next.label}</span>`;
    b.addEventListener("click", ()=>showSection(next.id));
    nav.appendChild(b);
  }
  container.appendChild(nav);
}

/* ---------------- section builders ---------------- */
function el(tag, attrs, html){
  const e = document.createElement(tag);
  if(attrs) for(const k in attrs) e.setAttribute(k, attrs[k]);
  if(html !== undefined) e.innerHTML = html;
  return e;
}

function buildBasics(root){
  root.appendChild(el("div",{class:"eyebrow"},"01 · 从零开始"));
  root.appendChild(el("h1",{class:"title"},"先认识指板上的音"));
  root.appendChild(el("p",{class:"dek"},"不背五线谱也没关系——吉他上的乐理，本质是\"指板上哪两个格子之间差多远\"。这一节把最基础的几个概念讲透，后面所有内容都建立在它上面。"));

  root.appendChild(el("h2",{class:"sec"},"半音与全音：指板上的最小单位"));

  root.appendChild(el("h2",{class:"sec"},"学习节奏建议"));
  root.appendChild(el("ol",{class:"list"},`
    <li>第1天：练习手册的听辨+拆段，同时看完本页第1、2节（乐理基础+和弦级数）</li>
    <li>第2天：攻克和弦转换难点时，同步看第3节（按法图鉴），把横按原理和手上的动作对上</li>
    <li>第3天：全曲连贯弹唱之后，用第4、5节（即兴+编配）尝试给自己加一两处个人化处理</li>
  `));

  root.appendChild(el("div",{class:"callout"},`<b>关于软件：</b>我没有办法帮你在电脑上安装第三方看谱/编曲软件——这类操作需要你自己完成。如果想要更专业的可视化与打谱工具，可以考虑 <b>MuseScore</b>（免费、五线谱+六线谱都支持，适合打谱和回放）或 <b>Guitar Pro</b>（付费，六线谱编辑与音效回放很强，练习吉他谱最常用）。这个网页本身可以当作日常复习和自查的地方，随时回来看进度。`));

  const items = [
    "我能把这首歌的每个段落对应到具体的和声功能",
    "我在至少一个段落尝试了即兴或编配处理",
  ];
  root.appendChild(el("h2",{class:"sec"},"自查"));
  checklist(root, "gtb_check_apply", items);
  stepperNav(root, "apply");
}

/* ---------------- boot ---------------- */
function boot(){
  buildNav();
  const main = document.getElementById("main");
  const builders = { basics:buildBasics, degrees:buildDegrees, shapes:buildShapes, impro:buildImpro, arrange:buildArrange, apply:buildApply };
  SECTIONS.forEach(s => {
    const sec = el("section", { class:"panel", id:s.id });
    main.appendChild(sec);
    builders[s.id](sec);
  });
  let last = "basics";
  try{ last = localStorage.getItem("gtb_last_section") || "basics"; }catch(e){}
  if(!SECTIONS.find(s=>s.id===last)) last = "basics";
  showSection(last);
}
boot();
</script>
